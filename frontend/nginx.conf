server {
  listen 5103;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8103/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api:8103/health;
  }

  location /ready {
    proxy_pass http://api:8103/ready;
  }

  location / {
    try_files $uri /index.html;
  }
}
