name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wfo
          POSTGRES_PASSWORD: wfo
          POSTGRES_DB: wfo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wfo -d wfo"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://wfo:wfo@127.0.0.1:5432/wfo
      DATABASE_URL: postgresql+psycopg://wfo:wfo@127.0.0.1:5432/wfo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm assert:no-fc-premium

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install backend
        working-directory: backend
        run: uv sync
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke
        working-directory: frontend
        run: pnpm test:e2e
        env:
          CI: "true"

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke
        run: |
          set -euo pipefail
          docker compose up --build -d
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8103/ready >/dev/null; then
              echo "API ready"
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker compose down -v
          exit 1
