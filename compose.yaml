services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wfo
      POSTGRES_PASSWORD: wfo
      POSTGRES_DB: wfo
    ports:
      - "127.0.0.1:5403:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfo -d wfo"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - wfo_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: demo
      HOST: 0.0.0.0
      PORT: 8103
      ALLOW_NETWORK_BIND: "true"
      DATABASE_URL: postgresql+psycopg://wfo:wfo@db:5432/wfo
      SOLVER_NUM_WORKERS: "4"
      CORS_ORIGINS: http://127.0.0.1:5103,http://localhost:5103
    ports:
      - "127.0.0.1:8103:8103"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "127.0.0.1:5103:5103"
    depends_on:
      - api

volumes:
  wfo_pg:
