[project]
name = "workforce-optimizer"
version = "0.1.0"
description = "Constraint-based workforce scheduling with OR-Tools CP-SAT and an independent validator."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "ortools>=9.11",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires PostgreSQL via POSTGRES_TEST_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes.py" = ["B008"]
